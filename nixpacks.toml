# Railway Nixpacks Configuration for MR SAQIB MD

[phases.setup]
nixPkgs = ["nodejs_22", "ffmpeg"]

[phases.install]
cmds = ["npm install --production=false"]

[phases.build]
cmds = []

[variables]
NODE_OPTIONS = "--experimental-require-module"

[start]
cmd = "node --experimental-require-module index.js"
